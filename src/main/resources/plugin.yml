name: FoliaSkyblock
version: 1.0.0
main: com.thenerdcj.FoliaSkyblock
api-version: 1.21
author: TheNerdCJ
description: High-performance Skyblock plugin for Folia 1.21+

commands:
  island:
    description: Main island command
    usage: /<command> [create|home|invite|accept|kick|rank|top]
    aliases: [is, skyblock]

  bal:
    description: Check your balance
    usage: /<command>
    aliases: [balance, money]

  rank:
    description: Check your rank
    usage: /<command>

  mute:
    description: Mute a player
    usage: /<command> <player> [duration] [reason]
    permission: folia.moderator.mute

  unmute:
    description: Unmute a player
    usage: /<command> <player>
    permission: folia.moderator.mute

  staff:
    description: Staff panel
    usage: /<command>
    permission: folia.staff

  admin:
    description: Admin panel
    usage: /<command>
    permission: folia.admin

  setspawn:
    description: Set the server spawn location
    usage: /<command>
    permission: folia.admin
    aliases: [spawnset]

  spawn:
    description: Teleport to spawn
    usage: /<command>

  home:
    description: Teleport to your island home
    usage: /<command>

  tpa:
    description: Send teleport request
    usage: /<command> <player>

  tpaccept:
    description: Accept teleport request
    usage: /<command> [player]
    aliases: [tpac]

  tpdeny:
    description: Deny teleport request
    usage: /<command> [player]
    aliases: [tpdecline]

  tpignore:
    description: Ignore TPA requests
    usage: /<command> [player]

  pending:
    description: View pending TPA requests
    usage: /<command>

  rules:
    description: View server rules
    usage: /<command>

permissions:
  folia.moderator.mute:
    description: Allows muting/unmuting players
    default: op

  folia.staff:
    description: Access to staff commands
    default: op

  folia.admin:
    description: Access to admin commands
    default: op

  folia.moderator:
    description: Moderator permissions
    default: op
    children:
      folia.moderator.mute: true