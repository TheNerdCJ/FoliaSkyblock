name: FoliaSkyblock
version: ${project.version}
main: com.thenerdcj.FoliaSkyblock
api-version: 1.21
load: STARTUP
folia-supported: true
author: TheNerdCJ

description: High-performance Skyblock plugin for Folia 1.21+ with custom island generation, party system, economy, trading, Play-to-Win progression, and full EssentialsX-style QoL commands.

commands:
  island:
    description: Main island command (create, reset, party, upgrades, etc.)
    usage: /<command> [create|home|tp|invite|accept|kick|promote|demote|disband|top|browse|visit|reset|upgrades|settings]
    aliases: [is, skyblock, sb]

  bal:
    description: Check your player balance (used for Chest Shops)
    usage: /<command>
    aliases: [balance, money, coins]

  rank:
    description: Check your player rank and voting
    usage: /<command> [vote|top]

  mute:
    description: Mute a player (staff only)
    usage: /<command> <player> [duration] [reason]
    permission: foliasb.staff.mute

  unmute:
    description: Unmute a player (staff only)
    usage: /<command> <player>
    permission: foliasb.staff.mute

  setspawn:
    description: Set the server spawn location (admin only)
    usage: /<command>
    permission: foliasb.admin.setspawn
    aliases: [spawnset]

  spawn:
    description: Teleport to the default unclaimable spawn (0,0)
    usage: /<command>
    aliases: [lobby]

  home:
    description: Teleport to your island home
    usage: /<command>

  # === Expanded TPA System ===
  tpa:
    description: Request to teleport to another player (with cooldown)
    usage: /<command> <player>
    aliases: [tpask, call]

  tpaccept:
    description: Accept a teleport request
    usage: /<command>
    aliases: [tpac, tpaaccept]

  tpdeny:
    description: Deny a teleport request
    usage: /<command>
    aliases: [tpdecline, tpno]

  tpignore:
    description: Toggle ignoring TPA requests from a specific player
    usage: /<command> <player>

  tplist:
    description: Open interactive GUI of pending TPA requests (Left-click = Deny, Right-click = Accept)
    usage: /<command>

  pending:
    description: Show how many pending TPA requests you have
    usage: /<command>
  vanish:
    description: Toggle vanish mode
    permission: foliasb.staff.vanish

    # === Private Messaging ===
  msg:
    description: Send a private message to a player
    usage: /<command> <player> <message>
    aliases: [tell, whisper, m, pm]

  r:
    description: Reply to your last private message
    usage: /<command> <message>
    aliases: [reply]

  # === List & Help ===
  list:
    description: List all online players with their rank prefixes
    usage: /<command>
    aliases: [online, who, ls]

  help:
    description: Show the help menu with available commands
    usage: /<command>
    aliases: [commands, ?]

  rules:
    description: View the server rules
    usage: /<command>

  # Bug reporting / player feedback system (in-game tickets for bugs, exploits, suggestions)
  bug:
    description: Submit a bug report, exploit, or suggestion. Staff use /bug reports or /reports to triage.
    usage: /<command> [bug|exploit|suggestion|other] <detailed description>
    aliases: [bugreport, reportbug]

  reports:
    description: (Staff) Open the bug reports triage GUI directly
    usage: /<command>
    permission: foliasb.staff

  challenge:
    description: View daily, weekly, and progression challenges
    usage: /<command>
    aliases: [challenges]

  trade:
    description: Open the island trading GUI
    usage: /<command>

  enchant:
    description: Open the custom enchanting table
    usage: /<command>
    aliases: [ench, etable]

  auction:
    description: Open the Auction House
    usage: /<command>
    aliases: [ah]

  bazaar:
    description: Open the Bazaar (instant buy/sell)
    usage: /<command>
    aliases: [bz]

  minions:
    description: Open the minion management GUI
    usage: /<command>
    aliases: [minion]

  minionskins:
    description: Open the Minion Skins cosmetic menu (Play-to-Win)
    usage: /<command>
    aliases: [minionskin]

  furniture:
    description: Open the Island Furniture / Housing decor catalog
    usage: /<command>
    aliases: [housing, decor]

  music:
    description: Open the Island Music & Ambience menu
    usage: /<command>
    aliases: [ambience, sounds]

  emotes:
    description: Open the Cosmetic Emotes menu
    usage: /<command>
    aliases: [emote]

  chatbubbles:
    description: Open the Cosmetic Chat Bubbles menu (floating chat visuals)
    usage: /<command>
    aliases: [chatbubble, bubble, bubbles]

  weather:
    description: Open the Island Weather cosmetic effects catalog (set while on your island)
    usage: /<command>
    aliases: [islandweather, weathereffects, wfx]

  accessories:
    description: Open the Cosmetic Accessories menu (floating items around player)
    usage: /<command>
    aliases: [accessory]

  collections:
    description: View your island's Core Collections (unique items discovered through play)
    usage: /<command>
    aliases: [collection, coll]

  skills:
    description: "View your per-player skills (MCMMO-inspired: Mining, Woodcutting, etc. with abilities)"
    usage: /<command>
    aliases: [skill, mcstats]

  deathmessages:
    description: Open the Cosmetic Death Messages menu (custom text on death/kills)
    usage: /<command>
    aliases: [deathmessage, killmessages, killmessage]

  joinleave:
    description: Open the Cosmetic Join/Leave Messages menu (personalized rich messages on join/quit)
    usage: /<command>
    aliases: [joinleavemessage]

  wardrobe:
    description: Open the wardrobe to save and swap armor + equipment loadouts
    usage: /<command>
    aliases: [wd]
    permission: folia.skyblock.wardrobe

  isadmin:
    description: Admin tools for fixing islands and balances
    usage: /<command> <subcommand> ...
    permission: foliasb.admin

  slayer:
    description: Open the Slayer progression menu
    usage: /<command>

  trail:
    description: Open particle trail cosmetics
    usage: /<command>

  particles:
    description: Open particle trail cosmetics
    usage: /<command>

  pets:
    description: Open the pet management menu
    usage: /<command>

  tags:
    description: Open cosmetic tag selection
    usage: /<command>

  wings:
    description: Open elytra wing cosmetics
    usage: /<command>

  runes:
    description: Open rune management
    usage: /<command>

  deatheffects:
    description: Open death effect cosmetics
    usage: /<command>
    aliases: [death]

  backpackskins:
    description: Open backpack skin cosmetics
    usage: /<command>
    aliases: [backpacks]

  powerorbskins:
    description: Open power orb skin cosmetics
    usage: /<command>
    aliases: [orbskins]

  structures:
    description: Open island structure catalog
    usage: /<command>
    aliases: [structure]

  quests:
    description: Open quest log and refresh dailies
    usage: /<command>
    aliases: [quest, daily, dailies]

  overhead:
    description: Open overhead cosmetic options
    usage: /<command>

  nametag:
    description: Toggle overhead nametag visibility
    usage: /<command>

  staff:
    description: Staff command panel
    usage: /<command> <subcommand>
    permission: foliasb.staff

  fly:
    description: Toggle fly mode
    permission: foliasb.staff
    usage: /<command>

  god:
    description: Toggle god mode
    permission: foliasb.staff
    usage: /<command>

  heal:
    description: Heal yourself or a player
    permission: foliasb.staff
    usage: /<command> [player]

  speed:
    description: Set walk/fly speed
    permission: foliasb.staff
    usage: /<command> <speed> [player]

  gm:
    description: Change gamemode
    permission: foliasb.staff
    usage: /<command> <mode> [player]

  gamemode:
    description: Change gamemode
    permission: foliasb.staff
    usage: /<command> <mode> [player]

  # EssentialsX-style shortcuts (staff only)
  gmc:
    description: Set gamemode to creative
    permission: foliasb.staff
    usage: /gmc
  gms:
    description: Set gamemode to survival
    permission: foliasb.staff
    usage: /gms
  gma:
    description: Set gamemode to adventure
    permission: foliasb.staff
    usage: /gma
  gmsp:
    description: Set gamemode to spectator
    permission: foliasb.staff
    usage: /gmsp

  tp:
    description: Teleport to a player
    permission: foliasb.staff
    usage: /<command> <player>

  tphere:
    description: Teleport a player to you
    permission: foliasb.staff
    usage: /<command> <player>

  tppos:
    description: Teleport to coordinates
    permission: foliasb.staff
    usage: /<command> <x> <y> <z> [world]

  ban:
    description: Ban a player
    permission: foliasb.staff
    usage: /<command> <player> [reason]

  tempban:
    description: Temporarily ban a player
    permission: foliasb.staff
    usage: /<command> <player> <duration> [reason]

  kick:
    description: Kick a player
    permission: foliasb.staff
    usage: /<command> <player> [reason]

  warn:
    description: Warn a player
    permission: foliasb.staff
    usage: /<command> <player> <reason>

  invsee:
    description: View a player inventory
    permission: foliasb.staff
    usage: /<command> <player>

  endersee:
    description: View a player ender chest
    permission: foliasb.staff
    usage: /<command> <player>

  freeze:
    description: Freeze a player
    permission: foliasb.staff
    usage: /<command> <player>

  sc:
    description: Staff chat
    permission: foliasb.staff
    usage: /<command> <message>
    aliases: [staffchat]

  broadcast:
    description: Broadcast a message
    permission: foliasb.staff
    usage: /<command> <message>

  announce:
    description: Server announcement
    permission: foliasb.staff
    usage: /<command> <message>

  clear:
    description: Clear inventory
    permission: foliasb.staff
    usage: /<command> [player]

  repair:
    description: Repair held items
    permission: foliasb.staff
    usage: /<command>

  # EssentialsX-style time shortcuts (staff)
  day:
    description: Set the time to day
    permission: foliasb.staff
    usage: /<command>
  night:
    description: Set the time to night
    permission: foliasb.staff
    usage: /<command>

  holo:
    description: Manage holograms
    permission: foliasb.staff
    usage: /<command>
    aliases: [hologram]

permissions:
  folia.skyblock.wardrobe:
    description: Allows use of the /wardrobe command
    default: true
  foliasb.staff.mute:
    description: Allows muting and unmuting players
    default: op

  foliasb.staff:
    description: Access to staff panel and tools
    default: op

  foliasb.staff.spy:
    description: Allows spying on private messages (/msg and /r)
    default: op

  foliasb.admin.setspawn:
    description: Allows setting the global spawn location
    default: op

  foliasb.island.*:
    description: All island-related commands and features
    default: true

  foliasb.balance:
    description: Access to player and island balances
    default: true

  foliasb.rank:
    description: View ranks, vote, and leaderboards
    default: true

  foliasb.challenge:
    description: View and complete challenges
    default: true

  foliasb.trade:
    description: Access to trading system
    default: true

  foliasb.auction:
    description: Access to auction house
    default: true

  foliasb.bazaar:
    description: Access to bazaar
    default: true

  foliasb.enchant:
    description: Use custom enchanting table
    default: true

  foliasb.spawn:
    description: Teleport to spawn
    default: true

  foliasb.home:
    description: Teleport to island home
    default: true

  foliasb.tpa:
    description: Use TPA commands and GUI
    default: true

  foliasb.msg:
    description: Send and receive private messages
    default: true

  foliasb.rules:
    description: View server rules
    default: true

  foliasb.donor:
    description: Donor perks (biome selection, etc.)
    default: op

  foliasb.*:
    description: Grants all FoliaSkyblock permissions
    default: op
    children:
      foliasb.staff.mute: true
      foliasb.staff: true
      foliasb.staff.spy: true
      foliasb.admin.setspawn: true
      foliasb.island.*: true
      foliasb.donor: true