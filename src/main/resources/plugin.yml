name: FoliaSkyblock
version: 1.0.0
main: com.thenerdcj.FoliaSkyblock
api-version: 1.21
author: TheNerdCJ
description: High-performance Skyblock plugin for Folia 1.21+ with custom island generation, party system, and economy.

commands:
  island:
    description: Main island command with create, home, invite, etc.
    usage: /<command> [create|home|tp|invite|accept|kick|rank|top|setspawn]
    aliases: [is, skyblock, sb]

  bal:
    description: Check your player balance
    usage: /<command>
    aliases: [balance, money, coins]

  rank:
    description: Check your player rank and voting
    usage: /<command> [vote|top]

  mute:
    description: Mute a player (staff)
    usage: /<command> <player> [duration] [reason]
    permission: foliasb.staff.mute

  unmute:
    description: Unmute a player (staff)
    usage: /<command> <player>
    permission: foliasb.staff.mute

  staff:
    description: Staff panel and tools
    usage: /<command>
    permission: foliasb.staff

  setspawn:
    description: Set the server spawn location (admin)
    usage: /<command>
    permission: foliasb.admin.setspawn
    aliases: [spawnset]

  spawn:
    description: Teleport to server spawn
    usage: /<command>
    aliases: [lobby]

  home:
    description: Teleport to your island home

  tpa:
    description: Request to teleport to a player
    usage: /<command> <player>

  tpaccept:
    description: Accept a teleport request
    usage: /<command>

  pending:
    description: List your pending teleport requests
    usage: /<command>

  challenge:
    description: View your daily and weekly challenges
    usage: /<command>
    aliases: [challenges, daily]

  daily:
    description: View your daily challenges
    usage: /<command>

  trade:
    description: Open the island trading GUI
    usage: /<command>

  enchant:
    description: Open the custom enchanting table (no level limits!)
    usage: /<command>
    aliases: [ench, etable]

  rules:
    description: View server rules
    usage: /<command>

  auction:
    description: Open the auction house
    usage: /<command>
    aliases: [ah]

  bazaar:
    description: Open the bazaar (instant trading)
    usage: /<command>
    aliases: [bz]

  minions:
    description: Open the minion management GUI
    usage: /<command>
    aliases: [minion]

permissions:
  foliasb.staff.mute:
    description: Allows staff to mute and unmute players
    default: op

  foliasb.staff:
    description: Grants access to the staff panel and tools
    default: op

  foliasb.admin.setspawn:
    description: Allows administrators to set the global server spawn location
    default: op

  foliasb.island.*:
    description: All island-related commands and features
    default: true

  foliasb.balance:
    description: Allows checking player and island balances
    default: true

  foliasb.rank:
    description: Allows viewing player ranks, voting, and leaderboards
    default: true

  foliasb.challenge:
    description: Allows viewing and participating in daily/weekly challenges
    default: true

  foliasb.trade:
    description: Allows access to the island trading system/GUI
    default: true

  foliasb.auction:
    description: Allows access to the auction house
    default: true

  foliasb.bazaar:
    description: Allows access to the bazaar (instant buy/sell)
    default: true

  foliasb.enchant:
    description: Allows use of the custom enchanting table
    default: true

  foliasb.spawn:
    description: Allows teleporting to the server spawn
    default: true

  foliasb.home:
    description: Allows teleporting to your island home
    default: true

  foliasb.tpa:
    description: Allows sending and accepting teleport requests
    default: true

  foliasb.rules:
    description: Allows viewing the server rules
    default: true

  foliasb.*:
    description: Wildcard - grants all FoliaSkyblock permissions
    default: op
    children:
      foliasb.staff.mute: true
      foliasb.staff: true
      foliasb.admin.setspawn: true
      foliasb.island.*: true