# ==========================================
# FoliaSkyblock Rank Configuration
# ==========================================
# This file defines all ranks, their permissions, and display settings.
#
# DEFAULT RANK:
# - Add "default: true" to ONE rank - this will be given to all new players
# - If no rank has "default: true", the lowest priority rank is used

ranks:
  member:
    display-name: "Member"
    prefix: "&7[Member]"
    priority: 0
    staff: false
    donor: false
    default: true  # <-- THIS IS THE DEFAULT RANK FOR ALL NEW PLAYERS
    permissions:
      - "folia.island.create"
      - "folia.island.home"
      - "folia.island.invite"
      - "folia.island.chat"
      - "folia.shop.use"
      - "folia.trade.use"

  vip:
    display-name: "VIP"
    prefix: "&6[VIP]"
    priority: 1
    staff: false
    donor: true
    permissions:
      - "folia.island.create"
      - "folia.island.home"
      - "folia.island.invite"
      - "folia.island.chat"
      - "folia.shop.use"
      - "folia.trade.use"
      - "folia.island.biome.select"
      - "folia.island.size.large"

  helper:
    display-name: "Helper"
    prefix: "&e[Helper]"
    priority: 2
    staff: true
    donor: false
    permissions:
      - "folia.island.create"
      - "folia.island.home"
      - "folia.island.invite"
      - "folia.island.chat"
      - "folia.shop.use"
      - "folia.trade.use"
      - "folia.moderation.kick"
      - "folia.moderation.mute"
      - "folia.moderation.warn"

  moderator:
    display-name: "Moderator"
    prefix: "&9[Mod]"
    priority: 3
    staff: true
    donor: false
    permissions:
      - "folia.island.create"
      - "folia.island.home"
      - "folia.island.invite"
      - "folia.island.chat"
      - "folia.shop.use"
      - "folia.trade.use"
      - "folia.moderation.kick"
      - "folia.moderation.mute"
      - "folia.moderation.warn"
      - "folia.moderation.ban"
      - "folia.moderation.unban"
      - "folia.moderation.freeze"

  admin:
    display-name: "Admin"
    prefix: "&c[Admin]"
    priority: 4
    staff: true
    donor: false
    permissions:
      - "*"

  owner:
    display-name: "Owner"
    prefix: "&4[Owner]"
    priority: 5
    staff: true
    donor: false
    permissions:
      - "*"