# ================================================
# FoliaSkyblock - Full Configuration
# ================================================
# Island Settings
island:
  reset:
    enabled: true
    cost: 5000                    # Island balance cost (0 = free)
    cooldown-hours: 24            # Hours between resets (0 = disabled)
    require-confirmation: true
  base-y: 80
  spawn-protection-radius: 150
  dimension_requirements:
    nether: 15
    end: 30
  # Level gates enforced in IslandManager.createIsland + IslandCommand.handleCreate (Play-to-Win: must progress via XP/skills on main island).
  # Worth level (from block value) is separate for economy/tops; see IslandWorthManager. Explicit tie in Island.getProgressionLevel() / sync.
  # Default starter items are handled in IslandManager.java

  # Party system config (for XP balancing - ensures solo vs party progression speed feels fair, per design spec and Hypixel reference)
  party:
    max-size: 4
    # XP multipliers applied to island XP and skill XP gains. Higher party = lower per-person gain (diminishing returns).
    # This makes large parties not trivialize progression. Matches "progression speed feels identical whether single-player or multi-player".
    # Folia-safe: applied server-side in Island.addXp / addSkillXp via IslandManager.
    xp-multipliers:
      1: 1.0
      2: 0.85
      3: 0.75
      4: 0.65
      5: 0.60
      # For >5 falls back to 0.55 min in code. Config overrides take precedence.

  # =============================================
  # Island Worth / Level System (Classic Skyblock)
  # =============================================
  worth:
    # Block worth values (per block placed on island)
    # Higher value blocks contribute more to island worth and level
    block-worth:
      STONE: 1.0
      COBBLESTONE: 1.0
      DIRT: 0.5
      GRASS_BLOCK: 0.8
      OAK_LOG: 3.0
      DIAMOND_ORE: 150.0
      DIAMOND_BLOCK: 1350.0
      EMERALD_BLOCK: 1200.0
      NETHERITE_BLOCK: 4500.0
      SPAWNER: 800.0
      BEACON: 2500.0
      # Add more blocks as needed. Use Material name exactly.

    # Formula: worthLevel = floor(sqrt(totalWorth / 100)) + 1 (customizable)
    level-formula:
      base: 100.0          # Worth required for level 1
      multiplier: 1.5      # How fast levels scale

    # Upgrade multipliers applied to total worth (from IslandUpgradeManager)
    upgrade-multipliers:
      enabled: true
      # These are applied as finalWorth = baseWorth * multiplier
      # Example: If player has CROP_GROWTH level 5, it might give a small worth bonus

    # Performance tuning for large Folia servers (hundreds of islands)
    # Controls how often full worth recalculation runs globally.
    # For best perf on 500+ islands, prefer event-driven (block events already call adjustBlockWorth + invalidate)
    # and keep global interval long or disabled (set to 0 or negative to disable periodic full recalc).
    recalc-interval-minutes: 15   # Global periodic full recalc (drift correction). 0 = disabled (event-driven only recommended for scale)
    # Chunk budget to prevent lag on huge/custom islands; early exit in scan loops
    max-blocks-to-scan: 250000
    # Debug-only hot path profiling (nanoTime around worth chunk combine); logs when true. For dev/perf tuning only.
    profile-hot-paths: false
    # Cap work per tick for large servers (prevents lag spikes on 1000+ islands periodic)
    max-islands-per-recalc-tick: 50
    # Future: per-island-size tiers e.g. small:5, medium:15, large:60 (staggered RegionScheduler)

  # Perf caps and knobs for large scale servers (100s-1000+ islands/players) - compression/optimization
  perf:
    max-players-for-tab-update: 200  # cap tab list updates per tick for perf
    max-cache-size-warp: 500  # bounded cache for warps (LRU eviction)
    max-cache-size-rating: 1000  # bounded cache for ratings
    # other caps like max-islands-per-recalc-tick under worth, etc.
    # For compression: use bounded CHM (review/bound all for eviction + size caps; trails/overhead/collection/minion/hologram/skill + auction/island + real LRU in rating/bank/settings/warp etc added), Caffeine dep if ok (currently use LinkedHashMap LRU + manual eviction in managers like furniture/structure/warp/trails etc for no extra dep; real LRU for worthCache + rating etc), event-driven to avoid periodic full scans.
    # Data compression via paged lists in GUIs (e.g. AdminIslandInspectGUI incl. skills + enhanced puns/full logs + fuller + structures/quests/slayer/minions paged this pass), DB paginated queries for tops where possible (getTopRatedIslands(limit, offset) + loadAllPublicWarps(limit) + getTopIslandsByWorth(limit, offset) implemented/expanded this pass for actual server-side pagination on 1000+). More per-island RegionScheduler for globals/leaderboards recommended (e.g. stagger tops/leaderboard refresh at island centers instead of global; added in rating/Folia + actual in tops task + weekly + worth periodic). Caps for hoppers/auctions etc in future. H2 large sims to 1000 islands + notes. BossManager/QuestManager/HologramManager CHM bounds + profiling added this pass for ... tracking on large servers. Actual staggered code in more tasks (tax already per-island, tops/weekly/worth enhanced). Minion/Hologram profiling added.

  # Economy sinks (to prevent inflation, Play-to-Win balance)
  # Island upkeep: small % or flat drain on island balance over time (prestige/resource cost)
  upkeep:
    enabled: false   # Enable for production large servers; default off to avoid surprising players
    percent-per-hour: 0.5   # 0.5% of island balance per hour (if balance > 0)
    min-balance: 1000       # Only tax islands with at least this balance

# =============================================
# Bug Reporting System (player /bug + staff triage GUI)
# =============================================
reports:
  enabled: true
  cooldown-minutes: 5          # Per-player rate limit between submissions (staff bypass)
  max-description-length: 500  # Truncate long reports
  staff-notify: true           # Broadcast new reports to online staff (actionbar + chat preview)

# =============================================
# Booster System (Temporary Island Multipliers)
# =============================================
boosters:
  enabled: true
  # Default durations in minutes
  durations:
    short: 30
    medium: 60
    long: 120
  # Prices (island balance) - mission rewards often grant 2.0x short/medium
  prices:
    CROP_GROWTH:
      short: 5000
      medium: 9000
      long: 16000
    SPAWNER_RATE:
      short: 8000
      medium: 14000
      long: 25000
    ISLAND_XP:
      short: 6000
      medium: 11000
      long: 19000
    MONEY_EARN:
      short: 5500
      medium: 10000
      long: 17500
    MINION_SPEED:
      short: 7000
      medium: 12500
      long: 22000
  # Multipliers applied on top of upgrades (mission rewards default to 2.0)
  multipliers:
    CROP_GROWTH: 2.0
    SPAWNER_RATE: 2.0
    ISLAND_XP: 2.0
    MONEY_EARN: 2.0
    MINION_SPEED: 2.0

  # =============================================
  # Island Shop (Deepened - primary economy sink)
  # =============================================
  shop:
    enabled: true
    # Rich catalog. reward_type options: ITEM, BOOSTER, XP, WORTH, MINION_FUEL, CUSTOM
    # For BOOSTER: reward_data must contain type, multiplier, duration_minutes
    # For ITEM: optional custom_name / lore / material override
    # one_time: true = player/island can buy only once (persisted)
    # stock: -1 = unlimited, >0 = limited global stock (future)
    items:
      BOOSTER_TOKEN_CROP_60:
        name: "§eCrop Growth Token (60m)"
        material: EXPERIENCE_BOTTLE
        price: 7500
        category: BOOSTERS
        description: "§7Right-click this token to activate 2.0x crop growth for 60 minutes."
        reward_type: BOOSTER
        reward_data:
          type: CROP_GROWTH
          multiplier: 2.0
          duration_minutes: 60
        one_time: false
        stock: -1

      BOOSTER_TOKEN_XP_45:
        name: "§bIsland XP Token (45m)"
        material: EXPERIENCE_BOTTLE
        price: 8200
        category: BOOSTERS
        description: "§7Right-click to activate 2.0x Island XP gain for 45 minutes."
        reward_type: BOOSTER
        reward_data:
          type: ISLAND_XP
          multiplier: 2.0
          duration_minutes: 45
        one_time: false
        stock: -1

      SELL_WAND:
        name: "§6Sell Wand"
        material: STICK
        price: 18500
        category: SPECIAL
        description: "§7Right-click crops/ores to instantly sell them for island balance."
        reward_type: ITEM
        reward_data:
          custom_name: "§6§lSell Wand"
          lore:
            - "§7Mass sell tool"
            - "§eRight-click blocks to sell"
        one_time: false
        stock: -1

      MINION_FUEL_1000:
        name: "§7Minion Fuel Pack (1000)"
        material: COAL
        price: 6200
        category: MINIONS
        description: "§7Adds 1000 fuel to every minion on your island."
        reward_type: MINION_FUEL
        reward_data:
          amount: 1000
        one_time: false
        stock: -1

      ISLAND_XP_BUNDLE_250:
        name: "§aIsland XP Bundle (250)"
        material: NETHER_STAR
        price: 14500
        category: PROGRESSION
        description: "§7Instantly grants 250 Island XP."
        reward_type: XP
        reward_data:
          amount: 250
        one_time: false
        stock: -1

      WORTH_BOOST_500:
        name: "§dDirect Worth +500"
        material: DIAMOND
        price: 9500
        category: PROGRESSION
        description: "§7Permanently adds 500 to your island's worth (triggers recalc)."
        reward_type: WORTH
        reward_data:
          amount: 500
        one_time: true
        stock: -1

      ONE_TIME_BORDER_EXPANDER:
        name: "§3Border Expander Token"
        material: ENDER_PEARL
        price: 45000
        category: SPECIAL
        description: "§7One-time purchase. Expands your island border by +25 blocks (future)."
        reward_type: CUSTOM
        reward_data:
          action: BORDER_EXPAND
          value: 25
        one_time: true
        stock: -1

  # =============================================
  # Prestige System (High-endgame reset for permanent power)
  # =============================================
  prestige:
    enabled: true
    max_prestige: 10                    # Cap or -1 for unlimited (diminishing returns after)
    # Requirements to be able to prestige (per island)
    requirements:
      min_island_level: 50
      min_worth: 250000
      # Future: completed_missions or specific milestones
    # Multipliers granted by prestige level (these stack with upgrades + boosters)
    multipliers:
      xp: 0.10                          # +10% island XP per prestige level
      worth: 0.08                       # +8% worth from blocks per level
      money_earn: 0.12                  # +12% money from activities
      booster_effectiveness: 0.05       # Boosters are 5% stronger per level
    # Rewards given when you prestige (items, balance, etc.)
    rewards:
      level_1:
        money: 100000
        items:
          - "DIAMOND_BLOCK:64"
      level_5:
        money: 500000
        title: "§6§lLegendary"
      level_10:
        money: 2000000
        items:
          - "NETHERITE_BLOCK:16"

# =============================================
# Protection Settings
# =============================================
protection:
  # Spawn protection at world 0,0
  spawn-radius: 500
  spawn-protected-worlds:
    - "skyblock"
    - "skyblock_nether"
    - "skyblock_end"

  # General island protection
  wilderness-protection: true          # Prevent building in unclaimed areas
  explosion-protection: true
  piston-protection: true
  fire-protection: true
  enderman-grief: true

  # Messages
  messages:
    no-build: "&cYou cannot build here!"
    no-interact: "&cYou cannot interact here!"
# Grid System
grid:
  region-distance: 10   # Distance between islands (in chunks * 16)

# Default biomes for new players (Overworld only)
biomes:
  default:
    - "PLAINS"
    - "FOREST"
    - "DESERT"
    - "JUNGLE"
    - "SWAMP"
    - "SNOWY_PLAINS"

# Cooldowns (in seconds, 0 = disabled)
cooldowns:
  spawn: 60
  setspawn: 0
  tpa: 30
  tpaccept: 0
  tpdeny: 0
  tpignore: 30
  rules: 0
  bal: 5
  create: 300
  home: 60
  reset: 300
  delete: 0
  invite: 30
  accept: 0
  deny: 0
  kick: 30

# ================================================
# Island Upgrades Configuration (Priority 2 - Polished)
# ================================================
# Inspired by SuperiorSkyblock2 (multipliers + limits) and IridiumSkyblock (enhancements)
upgrades:
  crop-growth:
    multiplier-per-level: 0.25          # +25% growth speed per level
  ore-generator:
    bonus-per-level: 0.35               # Weight multiplier for better ores
  island-size:
    radius-per-level: 8                 # Extra blocks radius per level
    base-radius: 256                    # Starting protected/build radius (before any upgrades)
    max-radius: 512                     # Hard cap (can be increased by high Prestige)
    prestige-bonus:
      enabled: true
      extra-per-prestige: 16            # Additional radius per prestige level
    visuals:
      enabled: true
      worldborder: true                 # Use per-player WorldBorder for nice visuals
      particles: true                   # Spawn border particles (Folia-safe repeating task)
      particle-density: 4               # Blocks between particles
      expansion-effect: true            # Play nice sound + particles on upgrade purchase
      # Colored borders now respect island_settings.border_color (BLUE, RED, GREEN, GOLD, PURPLE, PINK, etc.)
      # Admin commands: /isadmin border setsize <player> <blocks>  and  setcolor <player> <color>
      # Hologram markers and auto WorldBorder on movement are available via BorderVisualManager
  # Task 5: Optional schematics (WorldEdit/FAWE) + size upgrades already wired to visuals/protection
  schematics:
    enabled: false  # set true + WE/FAWE on cp for admin custom island bases (procedural remains default for Play-to-Win fairness; schems for events/donors cosmetic only)
    # In IslandGenerator: if enabled and plugin present, can paste schematic at center before/after procedural features.
  spawner-rate:
    speed-bonus-per-level: 0.15         # +15% spawner activation speed
  mob-cap:
    increase-per-level: 0.20            # +20% hostile mob cap per level

  # Future: You can expand with more granular control per upgrade type.
  leave: 30
  setrank: 30
  members: 0
  top: 30
  trade: 5

# Economy Settings
economy:
  starting-balance: 1500.0
  currency-symbol: "$"
  # Format for display (you can change this later in EconomyManager)
  format: "%.2f"

# Island Economy (bank for leveling/trades)
island-economy:
  starting-balance: 500.0

# Minions Configuration (polished nice-to-haves)
minions:
  fuel:
    coal: 50
    charcoal: 40
    coal_block: 450
    blaze_rod: 120
    lava_bucket: 300
    wheat: 10
    ender_pearl: 80
  # Production multipliers per type (higher = better yields, slightly affects fuel cost)
  production:
    default: 1.0
    diamond: 0.4
    ender_pearl: 0.6
    slime: 0.9
    snow: 1.2
# ================================================
# Messages (you can expand these later)
# ================================================
messages:
  no-permission: "§cYou do not have permission to do that."
  not-online: "§cThat player is not online."
  combat-block: "§cYou cannot do that while in combat!"

# ================================================
# Rank System (used by RankManager)
# ================================================
# Full rank configuration is in ranks.yml (separate file)
# Voting settings are also in ranks.yml

# ================================================
# Do not edit below this line unless you know what you're doing
# ================================================

# =============================================
# Wardrobe Settings (light optional features)
# =============================================
wardrobe:
  # Light collection XP system (inspired by community requests for "own unique equipment" progression)
  # Awards small Island XP the first time a player saves a new equipment material type in any wardrobe slot.
  collection-xp:
    enabled: true
    amount: 15.0          # Island XP per new unique equipment material collected via wardrobe
    # Note: This is intentionally light / optional. Only triggers on the *first* save of each material.