# FoliaSkyblock Strengthened AntiCheat Configuration
# This plugin must remain Play to Win.
# Prevents exploits that bypass island progression, leveling to dimensions, boss fights, fair trading, player economy (chest shops), and island balance (upgrades).
# References: Hypixel-style behavior detection + community feedback from skyblock forums/YouTube dupe videos.

enabled: true
max-violations: 15
violation-decay-seconds: 120
alert-permission: foliasb.staff.alert

movement:
  speed:
    enabled: true
    threshold: 0.68
    violation-weight: 3
  fly:
    enabled: true
    threshold: 0.42
    violation-weight: 4

block:
  fastbreak:
    enabled: true
    min-delay-ms: 180
    # Note: On your own island, fastbreak detection is intentionally disabled for farm crops (wheat, potatoes,
    # carrots, etc.). Players legitimately break dozens of fully-grown plants per second while walking rows.
    # Other signals (XP rate, collection abuse, neural, item volume) still protect against automated farm macros.
  fastplace:
    enabled: true
    min-delay-ms: 150

xray:
  enabled: true
  max-per-minute: 8

dupe:
  hopper-check:
    enabled: true
  cross-claim:
    enabled: true
  # Item transaction (pickup/drop/inv move) rate limiting to catch dupes.
  # Legitimate play (farming mobs, breaking blocks with many drops, quick inventory, especially dense potato/carrot rows)
  # can trigger very fast pickups. Crop farming on your own island is heavily exempted to avoid false positives.
  item-rapid-threshold-ms: 400
  rapid-item-violation-weight: 2   # Lowered from 5 to reduce false positive kicks on legit play

illegal-item:
  scan-enabled: true

reports:
  detailed-log-enabled: true   # Writes to anticheat-violations.log for staff audits

punishment:
  level-1: warn
  level-2: kick
  level-3: ban
  ban-duration-hours: 24
  broadcast-to-staff: true

farming:
  # Multiplier applied to thresholds for XP/quest/collection when activity looks like own-island crop farming.
  # Higher = more lenient on legitimate dense farming (potato rows etc.).
  leniency-multiplier: 4.0
  # Std dev threshold (in ms) below which consistent farm break timing is considered suspicious
  # even on the player's own island. Real players have natural jitter; macros do not.
  macro-variance-threshold-ms: 25.0

# === Experimental Neural Detector (Tier 3 review) ===
# The neural network component is DISABLED by default.
# It is over-engineered for most servers. Use the fastbreak/xray/dupe heuristics instead,
# or replace this entire module with a professional anti-cheat plugin.
neural-detector:
  enabled: false
